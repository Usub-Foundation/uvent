site_name: Uvent Documentation
site_description: High-performance asynchronous I/O library for modern C++23
site_url: https://usub-foundation.github.io/uvent/
repo_url: https://github.com/Usub-Foundation/uvent
repo_name: Usub-Foundation/uvent
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.top
    - search.highlight
    - content.code.copy

plugins:
  - search
  - autorefs

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - admonition
  - attr_list
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Quick Start: quick-start.md
  - Tutorial: tutorial.md
  - Core Runtime:
      - Uvent: uvent.md
      - System Primitives: system_primitives.md
      - Introspection: introspection.md
  - Coroutines:
      - Awaitable: awaitable.md
      - Awaitable Frame: awaitable_frame.md
      - Tasks & Structured Concurrency: tasks.md
      - Cancellation: cancellation.md
      - Fibers (stackful): fibers.md
      - Runtime drain (stop): drain.md
  - Networking:
      - Socket: socket.md
      - Name Resolution & Happy Eyeballs: resolver.md
  - Delayed tasks:
      - Timers: timers.md
  - Settings:
      - Basic settings: settings.md
      - Build flags: build-flags.md
  - Synchronization:
      - Overview: synchronization.md
      - Channels:
          - Introduction: channels/channels.md
          - Select: channels/select.md
          - Examples: channels/examples.md
  - Contributing: contributing.md
  - Releases:
      - 4.1.0: releases/v4.1.0.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Usub-Foundation/uvent
      name: GitHub Repository
    - icon: fontawesome/solid/star
      link: https://github.com/Usub-Foundation/uvent/stargazers
      name: Star on GitHub

copyright: >
  Copyright &copy; 2025 Usub-Foundation, Kirill Zhukov (g2px1)